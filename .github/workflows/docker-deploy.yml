name: CI/CD for Career Finder

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: weilan1299/career_finder

jobs:
  build_push_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🔄 Checkout Code
        uses: actions/checkout@v3

      - name: 🧱 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}



      - name: 🚀 Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SERVER_SSH_KEY }}
          debug: true
          script: |
            ssh -i ${{ secrets.SERVER_SSH_KEY }} ${{ secrets.SERVER_IP }}
            docker pull ${{ env.IMAGE_NAME }}:latest
            docker stop careerfinder || true
            docker rm careerfinder || true
            docker run -d --name careerfinder -p 5000:5000 ${{ env.IMAGE_NAME }}:latest
